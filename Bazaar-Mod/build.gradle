plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = project.name
}

repositories {
	mavenCentral()
	// Mod Menu (compile-only: the config-screen entrypoint is only loaded when Mod Menu is installed)
	maven {
		url = "https://maven.terraformersmc.com/releases/"
		content { includeGroup "com.terraformersmc" }
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	compileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") { transitive = false }
	// Dev client only (not in the jar, not a dependency): lets runClient show the Mod Menu "Configure" button.
	localRuntime("com.terraformersmc:modmenu:${project.modmenu_version}") { transitive = false }

	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
	// The website's recipe list, for the craft engine (CraftPrices).
	from("../Bazaar-Analyzer-v12/app/data") {
		include "recipes.json"
		into "assets/bazaaranalyzer"
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

test {
	useJUnitPlatform()
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}
