# Dumps Coflnet / Hypixel market data (.github/data-tags.txt, script .github/tools/cofl-dump.mjs) to the `data-dump`
# branch, for working on the price prediction where those sites are blocked. Runs on a push whose commit message
# contains [data] (or by hand).
name: Market data dump
on:
  push:
    branches-ignore: [mod-jar, dev-shots, mc-api, data-dump]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dump:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[data]')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch
        run: node .github/tools/cofl-dump.mjs
      - name: Push to the data-dump branch
        run: |
          cd out && git init -q -b data-dump && git add . \
            && git -c user.name=ci -c user.email=ci@localhost commit -qm "data from ${GITHUB_SHA::7}" \
            && git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" data-dump
