# Every push: builds the mod + runs its tests; the jar is under the run's Artifacts (Actions tab > Build > the run).
name: Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build mod
        working-directory: Bazaar-Mod
        run: bash gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: Bazaar-Mod/build/libs/yoav-addons-*[0-9].jar
