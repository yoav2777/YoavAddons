# Publishes the website (Bazaar-Analyzer-v12/app) to GitHub Pages: https://yoav2777.github.io/YoavAddons/
# One-time setup: repo Settings > Pages > Source: GitHub Actions. Runs on every push to main that changes the site.
name: Website
on:
  push:
    branches: [main]
    paths: ['Bazaar-Analyzer-v12/app/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Bazaar-Analyzer-v12/app
      - id: deployment
        uses: actions/deploy-pages@v4
